name: Protocol tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - name: Run protocol tests
        run: dotnet test src/CloudpunkCoop.Protocol.Tests/CloudpunkCoop.Protocol.Tests.csproj -c Release
      - name: Build standalone test client
        run: dotnet build src/CloudpunkCoop.TestClient/CloudpunkCoop.TestClient.csproj -c Release
